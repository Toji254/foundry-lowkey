          python-version: "3.11"
          check-latest: true
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install Lowkey
        run: |
          ./install.sh
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
      - name: Validate complete test generation on a controlled Foundry fixture
        run: |
          rm -rf /tmp/lowkey-generation-fixture
          mkdir -p /tmp/lowkey-generation-fixture/src
          cat > /tmp/lowkey-generation-fixture/foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          out = "out"
          solc_version = "0.8.20"
          EOF
          cd /tmp/lowkey-generation-fixture
          git init -q
          git config user.email "ci@example.invalid"
          git config user.name "Lowkey CI"
          forge install foundry-rs/forge-std --no-commit
          cat > src/Counter.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.20;
          contract Counter {
              uint256 public value;
              function setValue(uint256 next) external { value = next; }
          }
          EOF
          lk test-gen Counter --types unit,fuzz,invariant --validate --strict
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/lowkey-generation-fixture")
          report = json.load(open(root / ".audit/test-gen/Counter/report.json", encoding="utf-8"))
          assert len(report["generated"]) == 3, report
          assert report["skipped"] == [], report
          assert report["validation"]["status"] == "passed", report["validation"]
          assert all(report["generation_assessment"][kind]["level"] == "executable-candidate"
                     for kind in ("unit", "fuzz", "invariant")), report["generation_assessment"]
          assert report["validation"].get("test_executions"), report["validation"]
          print("PASS: supported unit/fuzz/invariant generation compiled and executed against the fixture")
          PY
      - name: Verify unsupported public-project behavior fails closed
        run: |
          set +e
          python3 scripts/test-gen-ecosystem-benchmark.py \
            --limit-projects 1 --targets-per-project 1 \
            --output .audit/test-gen-ecosystem-smoke.json
          benchmark_exit=$?
          set -e
          # The pinned OpenZeppelin ERC20Mock is deliberately outside the generator's
          # safely inferred direct-setter property. It must be refused, not scaffolded.
          test "$benchmark_exit" -ne 0
          python3 - <<'PY'
          import json
          report = json.load(open(".audit/test-gen-ecosystem-smoke.json", encoding="utf-8"))
          assert report["project_count"] == 1, report
          assert report["evaluated_count"] == 0, report
          assert report["baseline_build_failed_count"] == 0, report
          assert report["generation_validation_failed_count"] == 1, report
          assert report["revision_pin_failed_count"] == 0, report
          project = report["results"][0]
          assert project["id"] == "openzeppelin-contracts", project
          assert project["status"] == "generation-validation-failed", project
          assert project["revision"] == "11565e5f6277a320408025e649240056ba6a3919", project
          assert project["baseline_build"]["exit_code"] == 0, project["baseline_build"]
          target = project["targets"][0]
          assert target["generation_report_found"], target
          assert not target["generation_succeeded"], target
          assert not target["validation_succeeded"], target
          assert target["validation_status"] == "not-applicable", target
          assert all(item["level"] == "not-generated"
                     for item in target["generation_assessment"].values()), target
          assert not target["formal_artifact_exists"], target
          print("PASS: unsupported protocol generation is rejected without fake test artifacts")
          PY
      - name: Retain ecosystem benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-generation-ecosystem-smoke
          path: .audit/test-gen-ecosystem-smoke.json
          if-no-files-found: warn

  test-generation-ecosystem-full:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          check-latest: true
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install Lowkey
        run: |
          ./install.sh
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
      - name: Run the complete pinned real-project corpus
        id: benchmark
        continue-on-error: true
        run: |
          python3 scripts/test-gen-ecosystem-benchmark.py \
            --manifest tests/fixtures/test-generation-ecosystem.json \
            --targets-per-project 2 \
            --work-dir /tmp/lowkey-full-ecosystem-work \
            --output .audit/test-gen-ecosystem-full.json
      - name: Summarize the full corpus without equating gaps with passes
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path(".audit/test-gen-ecosystem-full.json")
          if not path.is_file():
              raise SystemExit("Full benchmark did not produce a report")
          report = json.loads(path.read_text(encoding="utf-8"))
          print(f"Projects recorded: {report.get('project_count')}")
          print(f"Projects fully evaluated by the current runner: {report.get('evaluated_count')}")
          print(f"Baseline build failures: {report.get('baseline_build_failed_count')}")
          print(f"Generation/validation failures or coverage gaps: {report.get('generation_validation_failed_count')}")
          print(f"Revision pin failures: {report.get('revision_pin_failed_count')}")
          for item in report.get("results", []):
              print(f"{item.get('id')}: {item.get('status')} @ {item.get('revision', 'no-verified-revision')}")
          print("NOTE: a completed benchmark is not a security certification; inspect each target's per-category evidence.")
          PY
      - name: Retain full real-project benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-generation-ecosystem-full
          path: .audit/test-gen-ecosystem-full.json
          if-no-files-found: error

  vyper-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          check-latest: true
      - name: Install Vyper and Titanoboa test runtime
        run: python -m pip install "vyper>=0.4,<0.5" titanoboa pytest hypothesis
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install Lowkey
        run: ./install.sh
      - name: Build Vyper fixture
        run: |
          rm -rf /tmp/lowkey-vyper-fixture
          mkdir -p /tmp/lowkey-vyper-fixture/contracts
          cat > /tmp/lowkey-vyper-fixture/contracts/Counter.vy <<'EOF'
          #pragma version ^0.4.3

          count: public(uint256)

          @external
          def increment():
              self.count += 1

          @external
          def set_count(next_value: uint256):
              self.count = next_value
          EOF
      - name: Start Anvil
        run: |
          anvil --silent > /tmp/lowkey-vyper-anvil.log 2>&1 &
          for i in $(seq 1 20); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/lowkey-vyper-anvil.log
          exit 1
      - name: Exercise Vyper walkthrough
        working-directory: /tmp/lowkey-vyper-fixture
        run: |
          vyper --version
          lk --version
          lk doctor
          lk build
          lk walkthrough --static --contract Counter --steps 2
          test -f .audit/walkthrough/model.json
          grep -q '"kind": "vyper"' .audit/walkthrough/model.json
          lk walkthrough --auto --non-interactive --contract Counter --steps 1
          test -f script/LowkeyWalkthrough_Counter.sh
          grep -q 'cast send "$TARGET"' script/LowkeyWalkthrough_Counter.sh
          TARGET=$(python3 - <<'PY'
          import json
          print(json.load(open(".audit/walkthrough/latest.json"))["steps"][0]["address"])
          PY
          )
          test -n "$TARGET"
          cast code "$TARGET" --rpc-url http://127.0.0.1:8545 | grep -Eq '^0x[0-9a-fA-F]+$'
          cast call "$TARGET" 'count()(uint256)' --rpc-url http://127.0.0.1:8545
          lk break --function increment --rounds 1 | tee /tmp/lowkey-vyper-break.txt
          grep -q 'Backend : evm' /tmp/lowkey-vyper-break.txt
          grep -q 'Language: vyper' /tmp/lowkey-vyper-break.txt
          lk test-gen Counter --types unit,fuzz,invariant --validate --strict
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(".audit/test-gen/vyper/Counter/report.json").read_text(encoding="utf-8"))
          assert len(report["generated"]) == 3, report
          assert report["skipped"] == [], report
          assert report["validation"]["status"] == "passed", report["validation"]
          assert len(report["validation"]["test_executions"]) == 3, report["validation"]
          assert all(item["exit_code"] == 0 for item in report["validation"]["test_executions"]), report["validation"]
          assert report["recognized_property"]["setter"] == "set_count", report["recognized_property"]
          assert all(Path(item).is_file() for item in report["generated"]), report["generated"]
          print("PASS: Lowkey generated and executed Vyper unit/fuzz/sequence-property tests with Titanoboa")
          PY
          lk status
          lk context

  verification-live-foundry:
    runs-on: ubuntu-latest
    needs: foundry-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          check-latest: true
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install Lowkey
        run: |
          ./install.sh
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
      - name: Create minimal real Foundry fixture
        run: |
          mkdir -p /tmp/lowkey-verification-fixture/src /tmp/lowkey-verification-fixture/test
          cat > /tmp/lowkey-verification-fixture/foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          out = "out"
          solc_version = "0.8.20"
          EOF
          cat > /tmp/lowkey-verification-fixture/src/Counter.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.20;
          contract Counter {
              uint256 public value;
              function set(uint256 next) external { value = next; }
          }
          EOF
          cat > /tmp/lowkey-verification-fixture/test/Counter.t.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.20;
          import "../src/Counter.sol";
          contract CounterTest {
              function testSetAndRead() public {
                  Counter counter = new Counter();
                  counter.set(42);
                  require(counter.value() == 42, "counter value mismatch");
              }
          }
          EOF
      - name: Verify registry detection and execute a live Forge campaign through Lowkey
        working-directory: /tmp/lowkey-verification-fixture
        run: |
          lk verification engines --json > /tmp/lowkey-verification-engines.json
          python3 - <<'PY'
          import json
          report = json.load(open("/tmp/lowkey-verification-engines.json", encoding="utf-8"))
          project = report["project"]
          assert project["language"] == "solidity", project
          assert "solidity" in project["languages"], project
          assert "foundry" in project["build_systems"], project
          assert "foundry.toml" in project["markers"], project
          forge = next(engine for engine in report["engines"] if engine["name"] == "forge")
          assert forge["available"], forge
          assert forge["support_matrix"]["unit"]["supported"], forge
          print("PASS: project detection identifies Solidity + Foundry and Forge is executable")
          PY
          cat > campaign.json <<'EOF'
          {
            "test_kind": "unit",
            "profile": "light",
            "budget": {"timeout_seconds": 60},
            "request": {
              "argv_by_engine": {
                "forge": ["test", "--match-test", "testSetAndRead", "-vv"]
              }
            }
          }
          EOF
          lk verification run campaign.json --profile light --output .audit/verification/forge-unit-report.json
          python3 - <<'PY'
          import json
          report = json.load(open(".audit/verification/forge-unit-report.json", encoding="utf-8"))
          assert report["selected_count"] == 1, report
          assert report["summary"]["passed"] == 1, report["summary"]
          assert report["summary"]["failed"] == 0, report["summary"]
          forge = next(row["result"] for row in report["results"] if row["result"]["engine"] == "forge")
          assert forge["status"] == "passed", forge
          assert "testSetAndRead" in forge["raw_stdout"], forge["raw_stdout"]
          assert report["duration_seconds"] >= 0, report
          print("PASS: Lowkey completed a real Forge campaign and retained native stdout/evidence")
          PY

      - name: Exercise real campaign-to-finding correlation through Forge
        run: python3 scripts/verification-correlation-e2e.py

      - name: Exercise a real finding through targeted generation and Forge
        run: python3 scripts/verification-investigation-e2e.py

  verification-live-external-engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: true
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install Lowkey
        run: |
          ./install.sh
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
      - name: Install pinned external engine versions
        run: bash scripts/install-verification-engines.sh
      - name: Build real Solidity fixture for fuzz and symbolic testing
        run: |
          mkdir -p /tmp/lowkey-external-fixture/src /tmp/lowkey-external-fixture/test
          cat > /tmp/lowkey-external-fixture/foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          out = "out"
          solc_version = "0.8.20"
          EOF
          cat > /tmp/lowkey-external-fixture/src/InvariantHarness.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.20;
          contract InvariantHarness {
              uint256 public value;
              uint256 public mirror;
              function set(uint256 next) external {
                  value = next;
                  mirror = next;
              }
              function echidna_values_match() public view returns (bool) {
                  return value == mirror;
              }
          }
          EOF
          cat > /tmp/lowkey-external-fixture/test/InvariantHarness.t.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.20;
          import "../src/InvariantHarness.sol";
          contract InvariantHarnessTest {
              function testSetAndRead() public {
                  InvariantHarness target = new InvariantHarness();
                  target.set(42);
                  require(target.value() == 42 && target.mirror() == 42, "set/read mismatch");
              }
              function testFuzzSetAndRead(uint256 next) public {
                  InvariantHarness target = new InvariantHarness();
                  target.set(next);
                  require(target.value() == next && target.mirror() == next, "fuzz set/read mismatch");
              }
              // Halmos has separate check_* symbolic tests. Keep this smoke case
              // free of deployment cheatcodes so it validates the symbolic runner,
              // not a Foundry-only deployCode path.
              function check_uint8_increment_is_strict(uint8 input) public pure {
                  uint16 incremented = uint16(input) + 1;
                  assert(incremented > uint16(input));
              }
          }
          EOF
          cat > /tmp/lowkey-external-fixture/echidna.yaml <<'EOF'
          testMode: property
          testLimit: 32
          seqLen: 4
          workers: 1
          EOF
          cd /tmp/lowkey-external-fixture
          medusa init
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("medusa.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          fuzzing = config.setdefault("fuzzing", {})
          fuzzing["workers"] = 1
          fuzzing["timeout"] = 15
          fuzzing["testLimit"] = 100
          fuzzing["targetContracts"] = ["InvariantHarness"]
          fuzzing["deploymentOrder"] = ["InvariantHarness"]
          testing = fuzzing.setdefault("testing", {})
          properties = testing.setdefault("propertyTesting", {})
          properties["enabled"] = True
          properties["testPrefixes"] = ["echidna_"]
          compilation = config.setdefault("compilation", {})
          compilation["platform"] = "crytic-compile"
          platform = compilation.setdefault("platformConfig", {})
          platform["target"] = "."
          platform["args"] = ["--foundry-compile-all"]
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          json.loads(path.read_text(encoding="utf-8"))
          PY
          forge build
      - name: Run live Echidna and Medusa campaigns through Lowkey
        working-directory: /tmp/lowkey-external-fixture
        run: |
          echidna --version
          medusa --help >/dev/null
          cat > fuzz-campaign.json <<'EOF'
          {
            "test_kind": "fuzz",
            "profile": "balanced",
            "budget": {"timeout_seconds": 120, "max_output_bytes": 1048576},
            "request": {
              "argv_by_engine": {
                "forge": ["test", "--match-test", "testFuzzSetAndRead", "--fuzz-runs", "16"]
              },
              "engine_config_by_engine": {
                "echidna": {
                  "target": "src/InvariantHarness.sol",
                  "contract": "InvariantHarness",
                  "config": "echidna.yaml"
                },
                "medusa": {
                  "config": "medusa.json",
                  "target_contracts": ["InvariantHarness"],
                  "engine_timeout_seconds": 15,
                  "workers": 1
                }
              }
            }
          }
          EOF
          lk verification run fuzz-campaign.json --profile balanced --output .audit/verification/fuzz-campaign.json
          python3 - <<'PY'
          import json
          report = json.load(open(".audit/verification/fuzz-campaign.json", encoding="utf-8"))
          results = {item["result"]["engine"]: item["result"] for item in report["results"]}
          assert {"forge", "echidna", "medusa"} <= set(results), report["considered_engines"]
          for engine in ("forge", "echidna", "medusa"):
              assert results[engine]["status"] == "passed", (engine, results[engine])
              assert results[engine]["duration_seconds"] is not None, (engine, results[engine])
          print("PASS: live Forge, Echidna, and Medusa campaigns completed with normalized results")
          PY
      - name: Run a live Halmos symbolic campaign through Lowkey
        working-directory: /tmp/lowkey-external-fixture
        run: |
          cat > halmos-campaign.json <<'EOF'
          {
            "test_kind": "formal",
            "profile": "deep",
            "budget": {"timeout_seconds": 120, "max_output_bytes": 1048576},
            "request": {
              "engine_config_by_engine": {
                "halmos": {"function": "check_uint8_increment_is_strict"}
              }
            }
          }
          EOF
          set +e
          lk verification run halmos-campaign.json --profile deep --output .audit/verification/halmos-campaign.json
          LOWKEY_EXIT=$?
          set -e
          python3 - <<'PY'
          import json
          report = json.load(open(".audit/verification/halmos-campaign.json", encoding="utf-8"))
          print("Campaign summary:", json.dumps(report.get("summary"), sort_keys=True))
          assert report["selected_count"] == 1, report["considered_engines"]
          result = report["results"][0]["result"]
          print("Halmos result:", result.get("status"), "exit_code=", result.get("exit_code"), "summary=", result.get("summary"))
          print("Halmos native stdout:\n" + (result.get("raw_stdout") or "")[-8000:])
          print("Halmos native stderr:\n" + (result.get("raw_stderr") or "")[-8000:])
          print("Halmos process evidence:", json.dumps(result.get("raw_evidence"), indent=2, sort_keys=True))
          assert result["engine"] == "halmos", result
          assert result["status"] == "passed", result
          assert "check_uint8_increment_is_strict" in result["raw_stdout"] + result["raw_stderr"], result
          assert "[PASS]" in result["raw_stdout"] + result["raw_stderr"], result
          print("PASS: live Halmos symbolic result was normalized from native PASS evidence")
          PY
      - name: Confirm Certora CLI installation without submitting a paid remote proof
        run: |
          certoraRun --help >/tmp/lowkey-certora-help.txt
          grep -qi 'conf' /tmp/lowkey-certora-help.txt
          echo "PASS: Certora CLI starts. Remote proof execution/polling requires authorized credentials and is intentionally not invoked in CI."
      - name: Exercise Slither static analysis on the fixture
        working-directory: /tmp/lowkey-external-fixture
        run: |
          slither --version
          slither . --fail-none
          echo "PASS: Slither compiled and analyzed the live Foundry fixture"
