name: Validate LowkeyCast

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          check-latest: true
      - name: Compile
        run: python -m py_compile lowkey/step_renderer.py lowkey/lk.py lowkey/forge_tools.py lowkey/generator.py lowkey/slither_tools.py lowkey/audit_context.py lowkey/project_detection.py lowkey/bootstrap.py lowkey/clone_tools.py lowkey/walkthrough.py lowkey/walkthrough_benchmarks.py lowkey/walkthrough_finding_patterns.py lowkey/break_playbook.py lowkey/audit_engine.py lowkey/benchmark.py lowkey/system_model.py lowkey/project_tools.py lowkey/analysis_adapters.py lowkey/verification_adapters.py lowkey/test_generation.py lowkey/test_generation_analysis.py lowkey/generation_plugins.py lowkey/behavioral_validation.py lowkey/verification_benchmark.py lowkey/verification_cli.py lowkey/signal_investigation.py lowkey/import_helper.py lowkey/solidity_cheatsheet.py lowkey/solidity_cheat_topics.py lowkey/solidity_cheat_data.py lowkey/solidity_connect_data.py lowkey/break_engine.py lowkey/ai_harness.py lowkey/ai_workflow.py lowkey/provider_adapters.py lowkey/agent_runtime.py lowkey/evidence_ledger.py lowkey/security_review.py lowkey/error_context.py lowkey/error_advisor.py lowkey/test_planner.py lowkey/experience_memory.py lowkey/jev_engine.py lowkey/godmode.py lowkey/proof_evidence.py lowkey/forge_state_diff.py lowkey/trace_evidence.py
      - name: Solidity cheatsheet tests
        run: python -m unittest tests/test_solidity_cheatsheet.py -v
      - name: Security regression benchmark
        run: python -m unittest tests/test_benchmark.py -v
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n bin/lk install.sh scripts/install-verification-engines.sh scripts/install-lh-jev-shortcuts.sh

  foundry-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - name: Verify dependencies
        run: |
          forge --version
          cast --version
          anvil --version
      - name: P0 ABI, token and receiver acceptance
        working-directory: tests/fixtures/acceptance/setup-compatibility
        run: forge test -vv
      - name: Install Lowkey
        run: ./install.sh
      - name: Exercise project-aware Chisel contract preload
        run: |
          set -euo pipefail
          CHISEL_ROOT=/tmp/lowkey-chisel-preload
          rm -rf "$CHISEL_ROOT"
          mkdir -p "$CHISEL_ROOT/src"
          cat > "$CHISEL_ROOT/foundry.toml" <<'EOF'
          [profile.default]
          src = "src"
          out = "out"
          solc_version = "0.8.20"
          EOF
          cat > "$CHISEL_ROOT/src/Counter.sol" <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.20;
          contract Counter {
              uint256 public value;
              function increment() external returns (uint256) {
                  return ++value;
              }
          }
          EOF
          set +e
          CHISEL_OUTPUT="$(lk chisel --root "$CHISEL_ROOT" --contract Counter eval 'lowkeySend_increment(address(0x1111)) == 1' 2>&1)"
          CHISEL_STATUS=$?
          set -e
          printf '%s\n' "$CHISEL_OUTPUT"
          if [ "$CHISEL_STATUS" -ne 0 ]; then
            exit "$CHISEL_STATUS"
          fi
          grep -q "true" <<<"$CHISEL_OUTPUT"
      - name: Exercise installed native AI and memory commands
        run: bash scripts/test-native-ai-harness.sh
      - name: Compile standalone Solidity cheat labs
        run: python -m unittest tests/test_solidity_cheat_labs.py -v
      - name: Compile Solidity connection labs
        run: python -m unittest tests/test_solidity_connect.py -v
      - name: Verify installed runtime module
        run: |
          test -f "$HOME/.lowkey/bootstrap.py"
          test -f "$HOME/.lowkey/import_helper.py"
          test -f "$HOME/.lowkey/break_playbook.py"
          test -f "$HOME/.lowkey/break_engine.py"
          test -f "$HOME/.lowkey/godmode.py"
          test -f "$HOME/.lowkey/proof_evidence.py"
          test -f "$HOME/.lowkey/forge_state_diff.py"
          test -f "$HOME/.lowkey/trace_evidence.py"
          test -f "$HOME/.lowkey/step_renderer.py"
          test -f "$HOME/.lowkey/templates/StepHarness.sol"
          test -f "$HOME/.lowkey/benchmark.py"
          test -f "$HOME/.lowkey/analysis_adapters.py"
          test -f "$HOME/.lowkey/verification_adapters.py"
          test -f "$HOME/.lowkey/test_generation.py"
          test -f "$HOME/.lowkey/test_generation_analysis.py"
          test -f "$HOME/.lowkey/generation_plugins.py"
          test -f "$HOME/.lowkey/behavioral_validation.py"
          test -f "$HOME/.lowkey/verification_benchmark.py"
          test -f "$HOME/.lowkey/verification_cli.py"
          test -f "$HOME/.lowkey/solidity_cheatsheet.py"
          test -f "$HOME/.lowkey/solidity_cheat_topics.py"
          test -f "$HOME/.lowkey/solidity_cheat_data.py"
          test -f "$HOME/.lowkey/solidity_connect_data.py"
          grep -q '/bootstrap.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/import_helper.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/break_playbook.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/break_engine.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/godmode.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/proof_evidence.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/forge_state_diff.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/trace_evidence.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/step_renderer.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/templates/StepHarness.sol":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/ai_harness.py":' "$HOME/.lowkey/install-manifest.json"
          test -f "$HOME/.lowkey/ai_workflow.py"
          grep -q '/ai_workflow.py":' "$HOME/.lowkey/install-manifest.json"
          test -f "$HOME/.lowkey/provider_adapters.py"
          test -f "$HOME/.lowkey/agent_runtime.py"
          test -f "$HOME/.lowkey/evidence_ledger.py"
          test -f "$HOME/.lowkey/security_review.py"
          grep -q '/provider_adapters.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/agent_runtime.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/evidence_ledger.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/security_review.py":' "$HOME/.lowkey/install-manifest.json"
          test -f "$HOME/.lowkey/test_planner.py"
          grep -q '/test_planner.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/experience_memory.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/analysis_adapters.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/verification_adapters.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/test_generation.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/test_generation_analysis.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/generation_plugins.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/behavioral_validation.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/verification_benchmark.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/verification_cli.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/solidity_cheatsheet.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/solidity_cheat_topics.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/solidity_cheat_data.py":' "$HOME/.lowkey/install-manifest.json"
          grep -q '/solidity_connect_data.py":' "$HOME/.lowkey/install-manifest.json"
          python3 - "$HOME/.lowkey" <<'PY'
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          sys.path.insert(0, str(root))
          import bootstrap
          assert pathlib.Path(bootstrap.__file__).resolve() == root / "bootstrap.py"
          PY

      - name: Build integration fixture
        run: |
          rm -rf /tmp/lowkey-fixture
          mkdir -p /tmp/lowkey-fixture/src /tmp/lowkey-fixture/test
          cat > /tmp/lowkey-fixture/foundry.toml <<'EOF'
          [profile.default]
          src = "src"
          test = "test"
          libs = ["lib"]
          fs_permissions = [{ access = "read-write", path = "./.audit/godmode" }]
          EOF
          cd /tmp/lowkey-fixture
          git init -q
          git config user.email "ci@example.invalid"
          git config user.name "Lowkey CI"
          forge install foundry-rs/forge-std --no-commit
          cat > src/Fixture.sol <<'EOF'
          pragma solidity ^0.8.20;
          contract Fixture {
              event Ping(uint256 value);
              uint256 public count;
              function ping(uint256 value) external {
                  count += value;
                  emit Ping(value);
              }
              function setCount(uint256 value) external {
                  count = value;
              }
              function deposit(uint256 amount) external payable {
                  require(amount == msg.value, "attach eth");
                  count += amount;
              }
          }
          EOF
          cat > test/Fixture.t.sol <<'EOF'
          pragma solidity ^0.8.20;
          import "forge-std/Test.sol";
          import "../src/Fixture.sol";

          contract FixtureTest is Test {
              Fixture public target;

              function setUp() public {
                  target = new Fixture();
                  targetContract(address(target));
              }

              function testSmoke() public {}
              function testFuzz_roundTrip(uint256 value) public {
                  target.ping(value);
              }

              function invariant_fixture_code() public view {
                  assert(address(target).code.length > 0);
              }
          }
          EOF

      - name: Start Anvil
        run: |
          anvil --silent \
            --port 8545 \
            --chain-id 31337 \
            --mnemonic "test test test test test test test test test test test junk" \
            --accounts 10 \
            --balance 10000 \
            --gas-price 1000000000 \
            --block-base-fee-per-gas 1000000000 \
            --gas-limit 30000000 \
            --timestamp 1700000000 \
            --hardfork cancun \
            > /tmp/lowkey-anvil.log 2>&1 &
          for i in $(seq 1 20); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/lowkey-anvil.log
          exit 1
      - name: P1 typed Step[] renderer acceptance
        working-directory: /tmp/lowkey-fixture
        run: |
          cat > .lowkey-steps.json <<'EOF'
          {
            "schema_version": 1,
            "family": "reentrancy",
            "target_address": "0x1111111111111111111111111111111111111111",
            "contract_name": "P1StepAcceptance",
            "steps": [
              {"kind":"reenter","selector":"0xaabbccdd","args":[]},
              {"kind":"call","selector":"0x12345678","args":[{"type":"uint256","value":1}],"optional":true},
              {"kind":"read","selector":"0xabcdef01","args":[]},
              {"kind":"unwind","selector":"0xdeadbeef","args":[],"optional":true},
              {"kind":"expect","target":"0x1111111111111111111111111111111111111111","selector":"0xaabbccdd","expect":{"count":1,"must_revert":false}},
              {"kind":"expect","target":"0x1111111111111111111111111111111111111111","selector":"0x12345678","expect":{"count":1,"must_revert":false}}
            ]
          }
          EOF
          lk steps .lowkey-steps.json --root /tmp/lowkey-fixture
          forge build --force
          python3 - <<'PY'
          import json
          from pathlib import Path
          artifact = json.loads(Path(".audit/steps/P1StepAcceptance.expectations.json").read_text())
          assert artifact["trace_expectations"] == [
              {
                  "step": 5,
                  "target": "0x1111111111111111111111111111111111111111",
                  "selector": "0xaabbccdd",
                  "count": 1,
                  "must_revert": False,
              },
              {
                  "step": 6,
                  "target": "0x1111111111111111111111111111111111111111",
                  "selector": "0x12345678",
                  "count": 1,
                  "must_revert": False,
              },
          ], artifact
          assert "proves execution" in artifact["policy"]
          assert Path("test/lowkey/P1StepAcceptance.sol").is_file()
          print("PASS: P1 ordered Step[] generated and Solidity harness compiled; expectations remain trace-only")
          PY
          cat > src/P1StepTarget.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.20;
          contract P1StepTarget {
              event Callback(address indexed caller);
              function trigger() external {
                  (bool ok,) = msg.sender.call{value: 1 wei}("");
                  require(ok, "STEP_RECEIVER_FAILED");
              }
              function callback() external {
                  emit Callback(msg.sender);
              }
              receive() external payable {}
          }
          EOF
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          target = "0x1111111111111111111111111111111111111111"
          callback = subprocess.check_output(["cast", "sig", "callback()"], text=True).strip()
          trigger = subprocess.check_output(["cast", "sig", "trigger()"], text=True).strip()
          manifest = {
              "schema_version": 1,
              "family": "reentrancy",
              "target_address": target,
              "contract_name": "P1StepReenter",
              "steps": [
                  {"kind":"reenter","target":target,"selector":callback,"args":[]},
                  {"kind":"call","target":target,"selector":trigger,"args":[]},
                  {"kind":"expect","target":target,"selector":callback,"expect":{"count":1,"must_revert":False}},
                  {"kind":"expect","target":target,"selector":trigger,"expect":{"count":1,"must_revert":False}}
              ]
          }
          Path(".lowkey-reenter.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          lk steps .lowkey-reenter.json --root /tmp/lowkey-fixture
          cat > test/P1StepReenter.t.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.20;
          import "forge-std/Test.sol";
          import "forge-std/Vm.sol";
          import "../src/P1StepTarget.sol";
          import "./lowkey/P1StepReenter.sol";

          contract P1StepReenterTest is Test {
              function test_generated_step_chain_executes_native_eth_reentry() external {
                  address target = 0x1111111111111111111111111111111111111111;
                  P1StepTarget implementation = new P1StepTarget();
                  vm.etch(target, address(implementation).code);
                  vm.deal(target, 1 ether);
                  P1StepReenter runner = new P1StepReenter();
                  vm.recordLogs();
                  runner.run();
                  Vm.Log[] memory logs = vm.getRecordedLogs();
                  bytes32 topic = keccak256("Callback(address)");
                  uint256 callbacks;
                  for (uint256 i; i < logs.length; ++i) {
                      if (logs[i].emitter == target && logs[i].topics.length == 2 &&
                          logs[i].topics[0] == topic &&
                          logs[i].topics[1] == bytes32(uint256(uint160(address(runner))))) {
                          callbacks++;
                      }
                  }
                  assertEq(callbacks, 1, "generated reentry callback did not execute exactly once");
              }
          }
          EOF
          grep -nE 'function (etch|deal|recordLogs|getRecordedLogs)\(' lib/forge-std/src/Vm.sol
          forge build --force
          forge test --match-path test/P1StepReenter.t.sol -vv
      - name: Run installed integration checks
        working-directory: /tmp/lowkey-fixture
        run: |
          lk --h
          lk --version
          grep -q 'Runtime:' <(lk --version)
          # Exercise the installed AI preview route without configuring a provider.
          # The command must not contact a provider and must exclude tests/dependencies.
          lk ai status
          lk ai run --help | tee /tmp/lowkey-ai-run-help.txt
          grep -q -- --plan-only /tmp/lowkey-ai-run-help.txt
          grep -q -- --yes /tmp/lowkey-ai-run-help.txt
          lk status --ai > /tmp/lowkey-status-ai.txt 2>&1
          grep -q 'AI GUIDANCE UNAVAILABLE' /tmp/lowkey-status-ai.txt
          grep -Eq 'LOWKEY|Target|RPC|target' /tmp/lowkey-status-ai.txt
          lk ai keys list --json > /tmp/lowkey-ai-keys.txt
          grep -q 'max_keys_per_provider_per_request' /tmp/lowkey-ai-keys.txt
          lk ai errors status --json > /tmp/lowkey-ai-errors.txt
          grep -q 'automatic_explanations_make_provider_requests' /tmp/lowkey-ai-errors.txt
          lk ai runtime --json > /tmp/lowkey-ai-runtime.json
          python3 -m json.tool /tmp/lowkey-ai-runtime.json >/dev/null
          lk ai test-plan --help | tee /tmp/lowkey-ai-test-plan-help.txt
          grep -q -- '--json' /tmp/lowkey-ai-test-plan-help.txt
          lk ai preview --root /tmp/lowkey-fixture | tee /tmp/lowkey-ai-preview.txt
          grep -q 'no provider request made' /tmp/lowkey-ai-preview.txt
          grep -q 'src/Fixture.sol' /tmp/lowkey-ai-preview.txt
          lk ai preview --root /tmp/lowkey-fixture --json-context > /tmp/lowkey-ai-context.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          preview = json.loads(Path("/tmp/lowkey-ai-context.json").read_text())
          assert preview["preview_only"] is True, preview
          assert preview["provider_request_made"] is False, preview
          assert preview["context_bytes"] <= preview["context_limit_bytes"], preview
          paths = [item["path"] for item in preview["context"]["source_files"]]
          assert "src/Fixture.sol" in paths, paths
          assert not any("Fixture.t.sol" in path for path in paths), paths
          assert not any(path.startswith("lib/") for path in paths), paths
          PY
          grep -q 'lk lab' <(lk -h)
          grep -q 'lk walkthrough' <(lk -h)
          grep -q 'lk system' <(lk -h)
          grep -q 'lk project' <(lk -h)
          grep -q 'lk audit run' <(lk -h)
          grep -q 'lk break' <(lk -h)
          lk break --h
          lk capabilities | tee /tmp/lowkey-capabilities.txt
          grep -q '^44 report' /tmp/lowkey-capabilities.txt
          lk fallback-map --root /tmp/lowkey-fixture > /tmp/lowkey-fallback-map.json
          python3 -m json.tool /tmp/lowkey-fallback-map.json >/dev/null
          lk cheat fingerprint --root /tmp/lowkey-fixture > /tmp/lowkey-cheat-fingerprints.json
          python3 -m json.tool /tmp/lowkey-cheat-fingerprints.json >/dev/null
          cat > /tmp/lowkey-fixture/fidelity.t.sol <<'EOF'
          contract FidelityFixture {
              function testSyntheticSetup() external {
                  vm.deal(address(this), 1 ether);
                  vm.prank(address(1));
              }
          }
          EOF
          lk fidelity --inspect fidelity.t.sol --root /tmp/lowkey-fixture > /tmp/lowkey-fidelity.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          fidelity = json.loads(Path("/tmp/lowkey-fidelity.json").read_text())
          assert fidelity["synthetic_eth"] is True, fidelity
          assert fidelity["caller_impersonation"] is True, fidelity
          assert fidelity["confirmation_eligible"] is False, fidelity
          print("PASS: harness fidelity scanner catches synthetic ETH and impersonation")
          PY
          cat > /tmp/lowkey-fixture/src/TraceControlFixture.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.20;
          contract TraceTarget {
              mapping(address => uint256) public credit;
              constructor() payable {}
              receive() external payable {}
              function setCredit(address who, uint256 amount) external { credit[who] = amount; }
              function withdraw() external {
                  uint256 amount = credit[msg.sender];
                  require(amount > 0, "NO_CREDIT");
                  (bool ok,) = msg.sender.call{value: amount}("");
                  require(ok, "TRANSFER_FAILED");
                  credit[msg.sender] = 0;
              }
          }
          contract TraceAttacker {
              address private immutable target;
              uint256 private mode = 3;
              bool private entered;
              constructor(address target_) { target = target_; }
              function setMode(uint8 value) external { mode = value; }
              function execute() external {
                  (bool ok, bytes memory reason) = target.call(abi.encodeWithSignature("withdraw()"));
                  if (!ok) assembly { revert(add(reason, 32), mload(reason)) }
              }
              receive() external payable {
                  if (mode == 2 && !entered) {
                      entered = true;
                      (bool ok, bytes memory reason) = target.call(abi.encodeWithSignature("withdraw()"));
                      if (!ok) assembly { revert(add(reason, 32), mload(reason)) }
                  }
              }
          }
          EOF
          forge build --force
          mkdir -p src
          cp "$GITHUB_WORKSPACE/docs/LowkeyForgeStateDiffRecorder.sol" src/LowkeyForgeStateDiffRecorder.sol
          cat > test/LowkeyStateDiffRecorder.t.sol <<'EOF'
          // SPDX-License-Identifier: MIT
          pragma solidity ^0.8.20;
          import {LowkeyForgeStateDiffRecorder} from "../src/LowkeyForgeStateDiffRecorder.sol";
          import {Vm} from "forge-std/Vm.sol";

          contract LowkeyStateDiffTarget {
              mapping(address => uint256) public credit;
              event Deposited(address indexed account, uint256 amount);
              event Withdrawn(address indexed account, uint256 amount);

              constructor() payable {}
              function depositFor(address account) external payable {
                  credit[account] += msg.value;
                  emit Deposited(account, msg.value);
              }
              function withdraw() external {
                  uint256 amount = credit[msg.sender];
                  require(amount != 0, "NO_CREDIT");
                  (bool ok,) = payable(msg.sender).call{value: amount}("");
                  require(ok, "TRANSFER_FAILED");
                  credit[msg.sender] = 0;
                  emit Withdrawn(msg.sender, amount);
              }
          }

          contract LowkeyStateDiffAttacker {
              LowkeyStateDiffTarget private immutable target;
              uint8 private mode;
              bool private entered;

              constructor(address target_) { target = LowkeyStateDiffTarget(target_); }
              function setMode(uint8 value) external { mode = value; }
              function execute() external { target.withdraw(); }
              receive() external payable {
                  if (mode == 2 && !entered) {
                      entered = true;
                      target.withdraw();
                  }
              }
          }

          contract LowkeyStateDiffRecorderTest is LowkeyForgeStateDiffRecorder {
              function _countEvent(Vm.Log[] memory logs, address emitter, bytes32 signature)
                  private pure returns (uint256 count)
              {
                  for (uint256 i; i < logs.length; ++i) {
                      if (logs[i].emitter == emitter && logs[i].topics.length != 0 &&
                          logs[i].topics[0] == signature) ++count;
                  }
              }

              function test_lowkey_paired_one_deployment_reentrancy() external {
                  vm.deal(address(this), 11 ether);
                  LowkeyStateDiffTarget target = new LowkeyStateDiffTarget{value: 10 ether}();
                  LowkeyStateDiffAttacker attacker = new LowkeyStateDiffAttacker(address(target));
                  attacker.setMode(0);

                  vm.recordLogs();
                  target.depositFor{value: 1 ether}(address(attacker));
                  Vm.Log[] memory setupEvents = vm.getRecordedLogs();
                  require(
                      _countEvent(setupEvents, address(target), keccak256("Deposited(address,uint256)")) == 1,
                      "SETUP_DEPOSIT_EVENT_MISSING"
                  );

                  uint256 snapshotId = vm.snapshot();
                  bytes memory withdrawCall = abi.encodeWithSignature("withdraw()");
                  // Foundry permits one counted expectation per target/calldata pair.
                  // Scenario-specific 1-vs-2 counts are checked from each recorded artifact below.
                  vm.expectCall(address(target), withdrawCall, 3);
                  vm.recordLogs();
                  _lowkeyStartTrace(address(target));
                  attacker.execute();
                  Vm.Log[] memory controlEvents = vm.getRecordedLogs();
                  require(
                      _countEvent(controlEvents, address(target), keccak256("Withdrawn(address,uint256)")) == 1,
                      "CONTROL_WITHDRAW_EVENT_COUNT"
                  );
                  _lowkeyWriteTrace(
                      ".audit/godmode/control-state-diff.json", controlEvents, setupEvents
                  );

                  require(vm.revertTo(snapshotId), "CONTROL_STATE_REVERT_FAILED");
                  // Same deployed target and attacker; switch mode outside the measured window.
                  attacker.setMode(2);
                  vm.recordLogs();
                  _lowkeyStartTrace(address(target));
                  attacker.execute();
                  Vm.Log[] memory attackEvents = vm.getRecordedLogs();
                  require(
                      _countEvent(attackEvents, address(target), keccak256("Withdrawn(address,uint256)")) == 2,
                      "ATTACK_WITHDRAW_EVENT_COUNT"
                  );
                  _lowkeyWriteTrace(
                      ".audit/godmode/attack-state-diff.json", attackEvents, setupEvents
                  );
                  require(address(attacker).balance == 2 ether, "ATTACKER_DID_NOT_RECEIVE_TWO_WITHDRAWALS");
              }
          }
          EOF
          PAIRED_FORK_BLOCK="$(cast block-number --rpc-url http://127.0.0.1:8545)"
          export LOWKEY_PAIRED_FORK_BLOCK="$PAIRED_FORK_BLOCK"
